<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Smart Nexus</title>

    <link rel="stylesheet" href="../estilo/cadastro.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="left">

        <h1>Smart Nexus</h1>

        <h2>Bem-vindo!</h2>

        <p>
            Conectamos empresas ao mundo do Marketing Digital.
        </p>

        <a href="usuario.html" class="btn-outline">
            Entrar
        </a>

    </div>


    <div class="right">

        <h2>Criar Conta</h2>

        <form>

            <input
            type="text"
            placeholder="Nome Completo">

            <input
            type="email"
            placeholder="E-mail">

            <input
            type="tel"
            placeholder="Telefone">

            <select>

                <option>Tipo de Conta</option>

                <option>Empresa</option>

                <option>Particular</option>

                <option>Free-lancer</option>

            </select>

            <input
            type="password"
            placeholder="Senha">

            <input
            type="password"
            placeholder="Confirmar Senha">

            <button>

                Criar Conta

            </button>

        </form>

    </div>

</div>
<button class="btn-voltar" onclick="history.back()">
    ← 
    
</button>
</body>
</html>
