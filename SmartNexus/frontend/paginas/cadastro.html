<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Smart Nexus</title>

    <link rel="stylesheet" href="../estilo/cadastro.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="left">

        <h1>Smart Nexus</h1>

        <h2>Bem-vindo!</h2>

        <p>
            Conectamos empresas ao mundo do Marketing Digital.
        </p>

        <a href="usuario.html" class="btn-outline">
            Entrar
        </a>

    </div>


    <div class="right">

        <h2>Criar Conta</h2>

        <form id="form-cadastro" novalidate>

            <input
            type="text"
            name="razao_social"
            placeholder="Razão social da empresa"
            maxlength="150"
            required>

            <input
            type="text"
            name="cnpj"
            placeholder="CNPJ (00.000.000/0000-00)"
            inputmode="numeric"
            maxlength="18"
            required>

            <input
            type="email"
            name="email"
            placeholder="E-mail"
            maxlength="150"
            required>

            <input
            type="tel"
            name="telefone"
            placeholder="Telefone com DDD"
            inputmode="tel"
            required>

            <p id="msg-cadastro" class="msg" role="alert"></p>

            <button type="submit">

                Criar Conta

            </button>

        </form>

    </div>

</div>
<button class="btn-voltar" onclick="history.back()">
    ← 
    
</button>
<script src="../js/cadastro.js"></script>
</body>
</html>
